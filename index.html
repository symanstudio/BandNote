      width: 100%;
      background-color: #ffffff;
      border-radius: 1.5rem;

      padding: 0.75rem;
      border-radius: 0.75rem;
      border: 2px solid #7dd3fc;
      background-color: #ffffff;
      width: 100%;
      outline: none;
    }
    .btn-domain {
      padding: 0 1rem;
      background-color: #bae6fd;
      color: #0c4a6e;
      font-weight: 700;
      border-radius: 0.75rem;
      white-space: nowrap;
      font-size: 0.875rem;
      border: 1px solid #7dd3fc;
      cursor: pointer;

    .select-inst {
      font-size: 1.125rem;
      padding: 0.75rem;
      border-radius: 0.75rem;
      border: 2px solid #7dd3fc;
      background-color: #ffffff;
      width: 100%;
      font-weight: 600;

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

      .grid-levels {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }
    .btn-level {
      padding: 0.75rem;
      border-radius: 1rem;
      font-weight: 700;
      font-size: 1rem;
      border: 4px solid;

      border-color: #3b82f6;
      background-color: #dbeafe;
      color: #1e3a8a;

      color: #166534;

      padding: 0.75rem;
      border-radius: 0.75rem;
      border: 1px solid #bae6fd;

      border-radius: 1rem;

      background-color: #22c55e;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.3);

    .btn-primary-disabled {
      background-color: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
    }

      background-color: #f1f5f9;
      padding: 0.75rem;
      border-radius: 1rem;
      border: 2px solid #e2e8f0;
      text-align: center;

      padding: 0.5rem;
      border-radius: 0.75rem;
      border: 1px solid #e2e8f0;
    }
    .status-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      display: block;
    }
    .status-value {
      font-size: 1.125rem;
      font-weight: 700;
      display: block;
    }

      height: 0.75rem;

      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.25rem;

<body>

  <canvas id="confettiCanvas"></canvas>

  <div class="app-card">
    
    <header id="appHeader" class="app-header">
      <h1>🎺 Band Note Challenge 🎷</h1>
      <p>Master your notes & level up your playing!</p>
    </header>

    <main>

      <!-- STEP 1: SETUP SCREEN -->
      <section id="step1-section" class="space-y-5">
        <div class="setup-box">
          <label class="setup-label">1. Student School Email Address:</label>
          <div class="flex gap-2">
            <input 
              type="email" 
              id="studentEmail" 
              name="email" 
              autocomplete="email" 
              placeholder="smithj@hudsonraiders.org" 
              class="input-email" 
              oninput="checkSetupReady()"
            >
            <button type="button" onclick="appendDomain()" class="btn-domain">
              + @hudsonraiders.org
            </button>
          </div>
          <p id="emailValidationMsg" style="color: #b45309; font-size: 0.75rem; font-weight: 700; margin-top: 0.375rem;" class="hidden">⚠️ Please enter a valid email address (e.g., smithj@hudsonraiders.org)</p>
        </div>

        <div class="setup-box">
          <label class="setup-label">2. Pick your instrument:</label>
          <select id="instrumentSelect" onchange="checkSetupReady()" class="select-inst">
            <option value="">-- Choose Instrument --</option>
            <option value="Flute">Flute</option>
            <option value="Clarinet">Clarinet</option>
            <option value="AltoSax">Alto Saxophone</option>
            <option value="Trumpet">Trumpet</option>
            <option value="FrenchHorn">French Horn</option>
            <option value="Trombone">Trombone / Euphonium</option>
            <option value="Tuba">Tuba</option>
            <option value="Mallets">Mallet Percussion</option>
          </select>
        </div>

        <div id="levelSelectContainer" class="hidden space-y-5">
          <label class="setup-label">3. Select Difficulty Level:</label>
          <div class="grid-levels">
            <button id="btnLvl1" onclick="selectLevel(1)" class="btn-level btn-lvl-unlocked">
              ⭐ Level 1
            </button>
            <button id="btnLvl2" onclick="selectLevel(2)" class="btn-level btn-lvl-locked" disabled>
              🔒 Level 2
            </button>
            <button id="btnLvl3" onclick="selectLevel(3)" class="btn-level btn-lvl-locked" disabled>
              🔒 Level 3
            </button>
            <button id="btnLvl4" onclick="selectLevel(4)" class="btn-level btn-lvl-locked" disabled>
              🔒 Level 4
            </button>
          </div>
          <div id="levelDescription" class="level-desc"></div>
        </div>

        <button id="startBtn" onclick="startQuiz()" disabled class="btn-primary btn-primary-disabled">
          Enter Valid Email & Select Instrument to Start
        </button>
      </section>

      <!-- STEP 2: QUIZ INTERFACE -->
      <section id="quiz-section" class="hidden space-y-5">
        
        <div class="grid-status">
          <div class="status-card">
            <span class="status-title">Instrument</span>
            <span id="activeInstBadge" class="status-value" style="color: #334155;">Flute</span>
          </div>
          <div class="status-card">
            <span class="status-title">Question</span>
            <span id="questionNum" class="status-value" style="color: #2563eb;">1 / 15</span>
          </div>
          <div class="status-card">
            <span class="status-title">Running Score</span>
            <span id="scoreDisplay" class="status-value" style="color: #16a34a;">100%</span>
          </div>
          <div class="status-card">
            <span class="status-title">Level</span>
            <span id="activeLevelBadge" class="status-value" style="color: #4f46e5;">Level 1</span>
          </div>
        </div>

        <div class="progress-bar-bg">
          <div id="progressBarFill" class="progress-bar-fill" style="width: 0%;"></div>
        </div>

        <div id="staffContainer" class="staff-container">
          <div id="feedbackText" class="feedback-text"></div>
          <div id="vexflowOutput" style="width: 100%; display: flex; justify-content: center; align-items: center; overflow: visible;"></div>
        </div>

        <div id="optionsContainer" class="grid-options"></div>
      </section>

      <!-- STEP 3: RESULTS SUMMARY -->
      <section id="results-section" class="hidden space-y-5" style="text-align: center; padding: 1rem 0;">
        <div>
          <h2 id="resultsTitle" style="font-size: 1.875rem; font-weight: 800; color: #1e293b;">Round Complete! 🎉</h2>
          <p id="resultsSubtext" style="color: #475569; font-weight: 600; font-size: 1.125rem; margin-top: 0.25rem;">Here is how you performed:</p>
        </div>

        <div id="resultsCard" class="results-card space-y-5">
          <div id="resultsBadge" style="font-size: 2.5rem;"></div>
          <div style="font-size: 3rem; font-weight: 800; color: #2563eb;" id="finalPercent">100%</div>
          <div style="color: #475569; font-weight: 700; font-size: 1.125rem;" id="finalFraction">15 out of 15 correct</div>
          <div id="unlockMessage" style="color: #16a34a; font-weight: 700; font-size: 1.125rem;" class="hidden"></div>
        </div>

        <div class="flex gap-3" style="justify-content: center; max-width: 28rem; margin: 0 auto; flex-direction: column;">
          <button id="restartBtn" onclick="restartRound()" class="hidden btn-primary" style="background-color: #3b82f6; color: white; cursor: pointer;">
            🔄 Try Again
          </button>
          
          <button id="nextLevelBtn" onclick="nextLevel()" class="hidden btn-primary" style="background-color: #22c55e; color: white; cursor: pointer;">
            🚀 Advance to Next Level
          </button>

          <button id="startOverBtn" onclick="startOverFromBeginning()" class="hidden btn-primary" style="background-color: #9333ea; color: white; cursor: pointer;">
            👑 Start Over from Level 1
          </button>
        </div>

        <div id="resultsLevelDescription" style="max-width: 28rem; margin: 0 auto;" class="level-desc"></div>
      </section>

    </main>
  </div>

        3: ["Ab1", "A1", "Bb1", "C2", "D2", "Eb2", "E2", "F2", "G2", "Ab1", "A2", "Bb2"],
        4: ["F1", "G1", "Ab1", "A1", "Bb1", "C2", "D2", "Eb2", "E2", "F2", "G2", "Ab2", "A2", "Bb2", "C3", "D3", "Eb3"]
      },
      "Mallets": {

        family: "C_INST",
        1: ["Bb3", "C4", "D4", "Eb4", "F4"],
        2: ["Ab3", "A3", "Bb3", "C4", "D4", "Eb4", "E4", "F4", "G4", "Ab4", "A4", "Bb4"],
        3: ["Ab3", "A3", "Bb3", "C4", "D4", "Eb4", "E4", "F4", "G4", "Ab4", "A4", "Bb4"],
        4: ["Ab4", "A4", "Bb4", "B4", "C5", "C#5", "D5", "Eb5", "E5", "F5", "F#5", "G5", "Ab5", "A5", "Bb5", "B5", "C6", "C#6", "D6", "Eb6", "E6", "F6", "F#6", "G6"]
      }
    };

    const LEVEL_DESCRIPTIONS = {
      1: "Level 1: Core 5 Beginner Notes (Bb, C, D, Eb, F concert equivalent). No key signatures.",
      2: "Level 2: Extended Octave Range. No key signatures.",
      3: "Level 3: Key Signatures ONLY (0–3 Concert Flats). No accidental symbols next to noteheads.",
      4: "Level 4: Extended Range with Key Signatures & Accidentals mixed together."
    };

    let currentLevel = 1;
    let maxUnlockedLevel = 1;
    let currentQuestionIndex = 0;
    let score = 0;
    let questions = [];
    let currentNoteObj = null;
    let currentKeySig = "none";

    window.addEventListener("DOMContentLoaded", () => {
      const savedEmail = localStorage.getItem("bandStudentEmail");
      const savedInst = localStorage.getItem("bandStudentInst");
      if (savedEmail) document.getElementById("studentEmail").value = savedEmail;
      if (savedInst) document.getElementById("instrumentSelect").value = savedInst;
      checkSetupReady();
    });

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function appendDomain() {
      const emailInput = document.getElementById("studentEmail");
      let val = emailInput.value.trim();
      if (!val.includes("@")) {
        emailInput.value = val + DEFAULT_SCHOOL_DOMAIN;
      }
      checkSetupReady();
    }

    function checkSetupReady() {
      const email = document.getElementById("studentEmail").value.trim();
      const inst = document.getElementById("instrumentSelect").value;
      const levelContainer = document.getElementById("levelSelectContainer");
      const startBtn = document.getElementById("startBtn");
      const msg = document.getElementById("emailValidationMsg");

      const emailValid = isValidEmail(email);

      if (email.length > 0 && !emailValid) {
        msg.classList.remove("hidden");
      } else {
        msg.classList.add("hidden");
      }

      if (emailValid && inst !== "") {
        localStorage.setItem("bandStudentEmail", email);
        localStorage.setItem("bandStudentInst", inst);

        levelContainer.classList.remove("hidden");
        startBtn.disabled = false;
        startBtn.className = "btn-primary btn-primary-enabled";
        startBtn.innerText = `🚀 Start Level ${currentLevel} Challenge`;
        updateLevelDescription();
      } else {
        levelContainer.classList.add("hidden");
        startBtn.disabled = true;
        startBtn.className = "btn-primary btn-primary-disabled";
        startBtn.innerText = "Enter Valid Email & Select Instrument to Start";
      }
    }

    function selectLevel(lvl) {
      if (lvl > maxUnlockedLevel) return;
      currentLevel = lvl;

      for (let i = 1; i <= 4; i++) {
        const btn = document.getElementById(`btnLvl${i}`);
        if (i === currentLevel) {
          btn.className = "btn-level btn-lvl-active";
        } else if (i <= maxUnlockedLevel) {
          btn.className = "btn-level btn-lvl-unlocked";
        }
      }
      updateLevelDescription();
      checkSetupReady();
    }

    function updateLevelDescription() {
      document.getElementById("levelDescription").innerText = LEVEL_DESCRIPTIONS[currentLevel];
    }

    function startQuiz() {
      document.getElementById("appHeader").classList.add("hidden");
      document.getElementById("step1-section").classList.add("hidden");
      document.getElementById("quiz-section").classList.remove("hidden");
      document.getElementById("results-section").classList.add("hidden");

      const instSelect = document.getElementById("instrumentSelect");
      const instLabel = instSelect.options[instSelect.selectedIndex].text.split('/')[0].trim();
      document.getElementById("activeInstBadge").innerText = instLabel;
      document.getElementById("activeLevelBadge").innerText = `Level ${currentLevel}`;

      score = 0;
      currentQuestionIndex = 0;

      generateQuestions();
      showQuestion();
    }

    function generateQuestions() {
      const instKey = document.getElementById("instrumentSelect").value;
      const poolKeys = INSTRUMENTS[instKey][currentLevel];
      const instFamily = INSTRUMENTS[instKey].family;
      
      let validPoolKeys = poolKeys;

      if (currentLevel === 3) {
        validPoolKeys = poolKeys.filter(key => {
          const noteObj = NOTE_LIBRARY[key];
          return getAccidentalForNote(noteObj, KEY_SIGNATURE_MAP[instFamily][1]) === null;
        });
      }
      if (validPoolKeys.length === 0) validPoolKeys = poolKeys;

      let deckKeys = [];

      if (currentLevel === 3 || currentLevel === 4) {
        const accidentalKeys = validPoolKeys.filter(k => NOTE_LIBRARY[k].alt !== null);

        if (accidentalKeys.length > 0) {
          const minAccidentals = 4;
          for (let i = 0; i < minAccidentals; i++) {
            const randAcc = accidentalKeys[Math.floor(Math.random() * accidentalKeys.length)];
            deckKeys.push(randAcc);
          }

          while (deckKeys.length < TOTAL_QUESTIONS) {
            const randKey = validPoolKeys[Math.floor(Math.random() * validPoolKeys.length)];
            deckKeys.push(randKey);
          }

          deckKeys.sort(() => Math.random() - 0.5);

          for (let i = 1; i < deckKeys.length; i++) {
            if (deckKeys[i] === deckKeys[i - 1] && validPoolKeys.length > 1) {
              let swapIdx = (i + 1) % deckKeys.length;
              let temp = deckKeys[i];
              deckKeys[i] = deckKeys[swapIdx];
              deckKeys[swapIdx] = temp;
            }
          }
        }
      }

      if (deckKeys.length < TOTAL_QUESTIONS) {
        deckKeys = [];
        while (deckKeys.length < TOTAL_QUESTIONS) {
          let shuffleBatch = [...validPoolKeys].sort(() => Math.random() - 0.5);
          for (let key of shuffleBatch) {
            if (deckKeys.length >= TOTAL_QUESTIONS) break;
            if (deckKeys.length > 0 && deckKeys[deckKeys.length - 1] === key && validPoolKeys.length > 1) {
              continue;
            }
            deckKeys.push(key);
          }
        }

        for (let i = 1; i < deckKeys.length; i++) {
          if (deckKeys[i] === deckKeys[i - 1] && validPoolKeys.length > 1) {
            let swapIdx = (i + 1) % deckKeys.length;
            let temp = deckKeys[i];
            deckKeys[i] = deckKeys[swapIdx];
            deckKeys[swapIdx] = temp;
          }
        }
      }

      questions = deckKeys.map(noteKey => {
        let keySigCode = "none";
        if (currentLevel >= 3) {
          const randFlats = Math.floor(Math.random() * 4);
          keySigCode = KEY_SIGNATURE_MAP[instFamily][randFlats];

          if (currentLevel === 3) {
            let attempts = 0;
            while (getAccidentalForNote(NOTE_LIBRARY[noteKey], keySigCode) !== null && attempts < 10) {
              keySigCode = KEY_SIGNATURE_MAP[instFamily][Math.floor(Math.random() * 4)];
              attempts++;
            }
          }
        }
        return {
          note: NOTE_LIBRARY[noteKey],
          keySig: keySigCode
        };
      });
    }

    function getAccidentalForNote(note, keySig) {
      const keyAccMap = {
        "1b": { "B": "b" },
        "2b": { "B": "b", "E": "b" },
        "3b": { "B": "b", "E": "b", "A": "b" },
        "1#": { "F": "#" },
        "2#": { "F": "#", "C": "#" },
        "3#": { "F": "#", "C": "#", "G": "#" }
      };

      const activeKeyAccs = keyAccMap[keySig] || {};
      const keyDefaultAcc = activeKeyAccs[note.letter] || null;
      const noteAcc = note.alt;

      if (noteAcc === keyDefaultAcc) return null;
      if (noteAcc === "b") return "♭";
      if (noteAcc === "#") return "♯";
      if (noteAcc === null && keyDefaultAcc !== null) return "♮";

      return null;
    }

    // =========================================================================
    // VEXFLOW RENDERING ENGINE (ORIGINAL PUBLICATION-GRADE ENGRAVING)
    // =========================================================================

    function showQuestion() {
      if (currentQuestionIndex >= TOTAL_QUESTIONS) {
        finishRound();
        return;
      }

      const q = questions[currentQuestionIndex];
      currentNoteObj = q.note;
      currentKeySig = q.keySig;

      const staffContainer = document.getElementById("staffContainer");
      staffContainer.className = "staff-container";

      const feedbackText = document.getElementById("feedbackText");
      feedbackText.innerText = "";
      feedbackText.style.color = "transparent";

      document.getElementById("questionNum").innerText = `${currentQuestionIndex + 1} / ${TOTAL_QUESTIONS}`;
      
      const runningPct = currentQuestionIndex === 0 ? 100 : Math.round((score / currentQuestionIndex) * 100);
      document.getElementById("scoreDisplay").innerText = `${runningPct}%`;

      const pctProgress = Math.round(((currentQuestionIndex) / TOTAL_QUESTIONS) * 100);
      document.getElementById("progressBarFill").style.width = `${pctProgress}%`;

      try {
        renderVexFlowStaff(currentNoteObj, currentKeySig);
      } catch (err) {
        console.error("VexFlow Render Error:", err);
      }

      renderOptions(currentNoteObj);
    }

    function renderVexFlowStaff(note, keySig) {
      const outputDiv = document.getElementById("vexflowOutput");
      outputDiv.innerHTML = "";

      const VF = (typeof Vex !== 'undefined' && Vex.Flow) ? Vex.Flow : (typeof VexFlow !== 'undefined' ? (VexFlow.Flow || VexFlow) : null);

      if (!VF) {
        outputDiv.innerHTML = "<p style='color: #ef4444; font-weight: bold; padding: 1rem;'>Local 'vexflow.js' file not found. Please place 'vexflow.js' in the same folder as this HTML file.</p>";
        return;
      }

      const { Renderer, Stave, StaveNote, Accidental, Formatter, Voice } = VF;

      const selectedInstKey = document.getElementById("instrumentSelect").value;
      const instClef = INSTRUMENTS[selectedInstKey].clef;
      const isTreble = instClef === "treble";

      const renderer = new Renderer(outputDiv, Renderer.Backends.SVG);
      renderer.resize(320, 210);
      const context = renderer.getContext();

      // SCALE UP NOTATION BY 25% MORE (1.5x scale)
      context.scale(1.5, 1.5);

      const stave = new Stave(10, 10, 190);
      stave.addClef(instClef);

      if (keySig !== "none") {
        const vexKeySigSpec = VEX_KEY_SIG_MAP[keySig];
        if (vexKeySigSpec) {
          stave.addKeySignature(vexKeySigSpec);
        }
      }

      stave.setContext(context).draw();

      let pitchStr = note.letter.toLowerCase();
      if (note.alt === "b") pitchStr += "b";
      else if (note.alt === "#") pitchStr += "#";

      const octaveStr = note.name.replace(/[^0-9]/g, '');
      const vexKeySpec = `${pitchStr}/${octaveStr}`;

      const middleLineStep = isTreble ? 6 : -6;
      const stemDir = note.step >= middleLineStep ? -1 : 1;

      const staveNote = new StaveNote({
        keys: [vexKeySpec],
        duration: "q",
        clef: instClef
      });

      staveNote.setStemDirection(stemDir);

      const accNeeded = getAccidentalForNote(note, keySig);
      if (accNeeded === "♭") {
        staveNote.addModifier(new Accidental("b"));
      } else if (accNeeded === "♯") {
        staveNote.addModifier(new Accidental("#"));
      } else if (accNeeded === "♮") {
        staveNote.addModifier(new Accidental("n"));
      }

      const noteStartX = stave.getNoteStartX();
      const noteEndX = stave.getNoteEndX();
      const availableWidth = noteEndX - noteStartX;

      const centerNoteX = noteStartX + (availableWidth / 2) - 10;
      stave.setNoteStartX(centerNoteX);

      const voice = new Voice({ num_beats: 1, beat_value: 4 }).addTickables([staveNote]);
      new Formatter().joinVoices([voice]).format([voice], 40);

      voice.draw(context, stave);
    }

    function renderOptions(correctNote) {
      const container = document.getElementById("optionsContainer");
      container.innerHTML = "";

      const masterPitches = ["A", "A♭", "B", "B♭", "C", "C♯", "D", "E♭", "E", "F", "F♯", "G", "G♭"];
      let optionsSet = new Set([correctNote.display]);

      if (correctNote.alt !== null && correctNote.letter) {
        optionsSet.add(correctNote.letter);
      }

      while (optionsSet.size < 8) {
        let randNote = masterPitches[Math.floor(Math.random() * masterPitches.length)];
        optionsSet.add(randNote);
      }

      let sortedOptions = Array.from(optionsSet).sort((a, b) => a.localeCompare(b, 'en', { sensitivity: 'base' }));

      sortedOptions.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "note-option-btn";
        btn.innerText = opt;
        btn.onclick = () => handleAnswer(opt, btn);
        container.appendChild(btn);
      });
    }

    function handleAnswer(selectedDisplay, buttonEl) {
      const staffContainer = document.getElementById("staffContainer");
      const feedbackText = document.getElementById("feedbackText");
      const isCorrect = selectedDisplay === currentNoteObj.display;

      document.querySelectorAll("#optionsContainer button").forEach(b => b.disabled = true);

      if (isCorrect) {
        score++;
        staffContainer.className = "staff-container staff-container-correct";
        feedbackText.innerText = "✨ Correct! Great job!";
        feedbackText.style.color = "#15803d";
        buttonEl.className = "note-option-btn btn-correct";
      } else {
        staffContainer.className = "staff-container staff-container-wrong";
        feedbackText.innerText = `❌ Oops! That was ${currentNoteObj.display}.`;
        feedbackText.style.color = "#b91c1c";
        buttonEl.className = "note-option-btn btn-wrong";
      }

      const runningPct = Math.round((score / (currentQuestionIndex + 1)) * 100);
      document.getElementById("scoreDisplay").innerText = `${runningPct}%`;

      setTimeout(() => {
        currentQuestionIndex++;
        showQuestion();
      }, 1800);
    }

    function finishRound() {
      document.getElementById("quiz-section").classList.add("hidden");
      document.getElementById("results-section").classList.remove("hidden");

      const percent = Math.round((score / TOTAL_QUESTIONS) * 100);
      document.getElementById("finalPercent").innerText = `${percent}%`;
      document.getElementById("finalFraction").innerText = `${score} out of ${TOTAL_QUESTIONS} correct`;

      const resultsTitle = document.getElementById("resultsTitle");
      const resultsSubtext = document.getElementById("resultsSubtext");
      const resultsBadge = document.getElementById("resultsBadge");
      const unlockMsg = document.getElementById("unlockMessage");
      const resultsLevelDesc = document.getElementById("resultsLevelDescription");

      const restartBtn = document.getElementById("restartBtn");
      const nextBtn = document.getElementById("nextLevelBtn");
      const startOverBtn = document.getElementById("startOverBtn");

      restartBtn.classList.add("hidden");
      nextBtn.classList.add("hidden");
      startOverBtn.classList.add("hidden");
      unlockMsg.classList.remove("hidden");

      if (percent >= 80) {
        if (currentLevel < 4) {
          maxUnlockedLevel = Math.max(maxUnlockedLevel, currentLevel + 1);
          const btnNext = document.getElementById(`btnLvl${currentLevel + 1}`);
          btnNext.disabled = false;
          btnNext.className = "btn-level btn-lvl-unlocked";
          
          nextBtn.classList.remove("hidden");
          nextBtn.innerText = `🚀 Advance to Level ${currentLevel + 1}`;
          resultsLevelDesc.innerText = `Up Next: ${LEVEL_DESCRIPTIONS[currentLevel + 1]}`;
        } else {
          resultsLevelDesc.innerText = `Completed: ${LEVEL_DESCRIPTIONS[4]}`;
        }

        if (currentLevel === 1) {
          resultsTitle.innerText = "⭐ Level 1 Complete! ⭐";
          resultsSubtext.innerText = "Awesome start! You've got the basics down.";
          resultsBadge.innerText = "🥉";
          unlockMsg.innerText = "Level 2 is now unlocked!";
          launchOfflineConfetti();
        } else if (currentLevel === 2) {
          resultsTitle.innerText = "🌟 Level 2 Mastered! 🌟";
          resultsSubtext.innerText = "Fantastic job! Your note-reading is getting fast!";
          resultsBadge.innerText = "🥈";
          unlockMsg.innerText = "Level 3 unlocked! Time to tackle key signatures!";
          launchOfflineConfetti();
        } else if (currentLevel === 3) {
          resultsTitle.innerText = "🔥 Level 3 Crushed! 🔥";
          resultsSubtext.innerText = "Incredible! Key signatures are no match for you!";
          resultsBadge.innerText = "🥇";
          unlockMsg.innerText = "Level 4 unlocked! The ultimate challenge!";
          launchOfflineConfetti();
        } else if (currentLevel === 4) {
          resultsTitle.innerText = "🏆 GRAND MASTER OF MUSIC! 🏆";
          resultsSubtext.innerText = "YOU BEAT ALL 4 LEVELS! You are an absolute sight-reading legend!";
          resultsBadge.innerText = "👑🎷🎺⭐🏆";
          unlockMsg.innerText = "🎉 All Levels Completed! Feel free to start over anytime.";
          startOverBtn.classList.remove("hidden");
          launchOfflineConfetti();
        }

      } else {
        restartBtn.classList.remove("hidden");
        resultsTitle.innerText = "Keep Practicing! 💪";
        resultsSubtext.innerText = "You need 80% to unlock the next level.";
        resultsBadge.innerText = "🎵";
        unlockMsg.innerText = "You can do it! Give it another try!";
        resultsLevelDesc.innerText = `Current Level: ${LEVEL_DESCRIPTIONS[currentLevel]}`;
      }

      saveScoreToStorage(percent);
      autoPostToGoogleForm(percent);
    }

    function launchOfflineConfetti() {
      const canvas = document.getElementById("confettiCanvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ["#22c55e", "#3b82f6", "#eab308", "#ec4899", "#a855f7"];

      for (let i = 0; i < 80; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.8) * 16,
          size: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1
        });
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        particles.forEach(p => {
          if (p.alpha > 0) {
            active = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.3;
            p.alpha -= 0.015;

            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
          }
        });

        if (active) {
          requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      render();
    }

    function restartRound() {
      startQuiz();
    }

    function nextLevel() {
      if (currentLevel < 4) {
        selectLevel(currentLevel + 1);
        startQuiz();
      }
    }

    function startOverFromBeginning() {
      document.getElementById("appHeader").classList.remove("hidden");
      document.getElementById("results-section").classList.add("hidden");
      document.getElementById("step1-section").classList.remove("hidden");
      selectLevel(1);
    }

    function saveScoreToStorage(percent) {
      const logs = JSON.parse(localStorage.getItem("bandNoteLogs") || "[]");
      logs.push({
        timestamp: new Date().toLocaleString(),
        email: document.getElementById("studentEmail").value,
        instrument: document.getElementById("instrumentSelect").value,
        level: currentLevel,
        score: percent
      });
      localStorage.setItem("bandNoteLogs", JSON.stringify(logs));
    }

    function autoPostToGoogleForm(percent) {
      const formUrl = DEFAULT_FORM_CONFIG.formUrl;

      const params = new URLSearchParams();
      params.append(DEFAULT_FORM_CONFIG.entryName, document.getElementById("studentEmail").value);
      params.append(DEFAULT_FORM_CONFIG.entryInst, document.getElementById("instrumentSelect").value);
      params.append(DEFAULT_FORM_CONFIG.entryLevel, `Level ${currentLevel}`);
      params.append(DEFAULT_FORM_CONFIG.entryScore, `${percent}%`);

      fetch(formUrl, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: params.toString()
      }).catch(err => console.error("Form submission error:", err));
    }
  </script>
